<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Connecting Edges -->
  <line x1="-35" y1="22" x2="0" y2="-32" stroke="url(#neonGrad)" stroke-width="3" />
  <line x1="35" y1="22" x2="0" y2="-32" stroke="url(#neonGrad)" stroke-width="3" />
  <line x1="-35" y1="22" x2="35" y2="22" stroke="url(#neonGrad)" stroke-width="3" />

  <!-- Graph Node Left -->
  <circle cx="-35" cy="22" r="9.5" fill="#FFFFFF" stroke="#0D9488" stroke-width="4" filter="url(#neonGlow)" />
  <circle cx="-35" cy="22" r="3.5" fill="#0D9488" />

  <!-- Graph Node Right -->
  <circle cx="35" cy="22" r="9.5" fill="#FFFFFF" stroke="#10B981" stroke-width="4" filter="url(#neonGlow)" />
  <circle cx="35" cy="22" r="3.5" fill="#10B981" />

  <!-- Central Prediction Core Top Node -->
  <g transform="translate(0, -32)">
    <circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="url(#neonGrad)" stroke-width="4.5" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="5" fill="#10B981" />
    <path d="M 0 -9 L 0 -6 M 0 6 L 0 9 M -9 0 L -6 0 M 6 0 L 9 0" stroke="#0D9488" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
